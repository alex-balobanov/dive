name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - uses: swift-actions/setup-swift@v3
      with:
        swift-version: "6.4"
    - name: Swift version
      run: swift --version
    - name: Run tests
      run: swift test -Xswiftc -strict-concurrency=complete --enable-code-coverage
    - name: Swift coverage
      uses: drekka/swift-coverage-action@v1.4
      with:
        show-all-files: true
        coverage: 70
